name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build, stage, verify, and publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Verify staged release in clean environment
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python -m venv .release-venv
          . .release-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "pal_found_cli==${RELEASE_VERSION#v}"
          pal-found-datasets --help

      - name: Publish verified release to PyPI
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0 # v1.9.0

  conda:
    name: Build and optionally publish conda package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          activate-environment: release
          python-version: "3.11"
          auto-activate-base: false

      - name: Build conda package
        shell: bash -el {0}
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          conda install --yes conda-build
          conda build conda.recipe --output-folder conda-channel

      - name: Publish conda package when channel permission exists
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if [[ -z "$ANACONDA_API_TOKEN" ]]; then
            echo "ANACONDA_API_TOKEN is not configured; build evidence retained, upload skipped."
            exit 0
          fi
          conda install --yes anaconda-client
          anaconda -t "$ANACONDA_API_TOKEN" upload --user t-jet conda-channel/*/*.conda --force
