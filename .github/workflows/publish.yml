name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build, stage, verify, and publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history + tags so setuptools-scm resolves the release tag at
          # HEAD (v0.1.2 -> 0.1.2). Without this the default shallow checkout
          # misses the tag and guess-next-dev derives 0.1.3.dev0, which breaks
          # the "Verify staged release" step that installs pal_found_cli==0.1.2.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # The staging publish must NOT generate attestations. With the default
          # (attestations: true) the action writes *.publish.attestation files into
          # dist/, and the subsequent production publish step then fails with "already
          # have publish attestations". Attestations bind to one index/OIDC exchange,
          # so generate them only on the final production publish below.
          attestations: false
          # The same tag can legitimately be re-pushed (e.g. to re-run a failed
          # production step); Test PyPI already holds the identical 0.1.2 filenames
          # from the first staging, so a plain re-upload returns 400 "File already
          # exists". Skip files that are already staged and let the verify step
          # re-confirm them. The production step keeps skip-existing=false: a file
          # that already exists on production must fail loudly, not be masked.
          skip-existing: true

      - name: Verify staged release in clean environment
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python -m venv .release-venv
          . .release-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ "pal_found_cli==${RELEASE_VERSION#v}"
          pal-found-datasets --help

      - name: Publish verified release to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  conda:
    name: Build and optionally publish conda package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          activate-environment: release
          python-version: "3.11"
          auto-activate-base: false

      - name: Build conda package
        shell: bash -el {0}
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          # setup-miniconda does not configure channels by default; without them
          # conda-build fails with "NoChannelsConfiguredError" when resolving host
          # dependencies (setuptools, pip, setuptools-scm, python, wheel).
          conda config --add channels conda-forge
          conda config --add channels defaults
          conda install --yes conda-build
          # Use the standalone conda-build binary instead of `conda build`.
          # On some conda versions the `build` subcommand is not registered from
          # the conda-build plugin in a non-base activated environment, which made
          # `conda build` fail with "invalid choice: 'build'". The conda-build binary
          # is always installed by the package and is version independent.
          conda-build conda.recipe --output-folder conda-channel

      - name: Publish conda package when channel permission exists
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          if [[ -z "$ANACONDA_API_TOKEN" ]]; then
            echo "ANACONDA_API_TOKEN is not configured; build evidence retained, upload skipped."
            exit 0
          fi
          conda install --yes anaconda-client
          anaconda -t "$ANACONDA_API_TOKEN" upload --user t-jet conda-channel/*/*.conda --force
